proxy_http_version          1.1;
proxy_ignore_client_abort   off;
proxy_read_timeout          86400s;
proxy_send_timeout          86400s;
proxy_max_temp_file_size    0;

# Everything Jellyfin plays is passed straight through. Buffering a transcode
# would mean collecting it into a file on disk before any of it reaches the
# player, which is the difference between playback starting in a second and
# playback starting when the episode is halfway written.
proxy_buffering             off;

proxy_set_header Connection $connection_upgrade;
proxy_set_header Host $http_host;
proxy_set_header Upgrade $http_upgrade;

# Jellyfin is told to trust these from the loopback address only, so the
# dashboard lists the address a client actually came from rather than listing
# NGINX for every session.
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Real-IP $remote_addr;
